<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>青翎引路 · 人淀共生</title>
<meta name="description" content="白洋淀散点化文旅资源智慧融合与具身传播路径调研" />
<meta name="theme-color" content="#16233f" />
<link rel="preload" as="image" href="assets/img/hero-sunset.jpg" />
<link rel="stylesheet" href="assets/styles.css" />
</head>
<body class="page-landing">

<section class="hero" id="hero">

  <div class="hero__media">
    <img src="assets/img/hero-sunset.jpg" alt="白洋淀水面与晚霞天空的倒影" width="2400" height="1800" fetchpriority="high" />
  </div>
  <div class="hero__wash" aria-hidden="true"></div>

  <div class="hero__content">
    <p class="eyebrow">让一切慢下来</p>

    <h1 class="hero__title">
      离这片水泊，<br />再近一点。
    </h1>

    <p class="hero__sub">
      一段慢下来的旅程。<br />
      一种还在生长的可能。
    </p>

    <div class="hero__cta">
      <a class="btn btn--solid" href="explore.html">
        <span class="btn__latin">EXPLORE</span>
        <span class="btn__sep" aria-hidden="true"></span>
        <span class="btn__cn">探索白洋淀</span>
        <span class="btn__arrow" aria-hidden="true">→</span>
      </a>

      <button class="play" type="button" id="watchFilm">
        <span class="play__disc" aria-hidden="true"><span class="play__triangle"></span></span>
        <span class="play__label">观看影片</span>
      </button>
    </div>
  </div>

</section>

<!-- 转场幕布：点击探索后由下而上覆盖，再进入内容界面 -->
<div class="veil" aria-hidden="true">
  <span class="veil__mark">水 韵 经 纬</span>
  <span class="veil__sub">人 淀 共 生</span>
</div>

<script src="assets/app.js" defer></script>
</body>
</html>
